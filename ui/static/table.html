<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JackTen Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="page table-page">
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">J<span>♠</span>10</span> JackTen</a>
  <nav class="nav"><a href="/">Home</a><a href="/table" class="active">Table</a><a href="/sim">Simulations</a></nav>
  <div class="meta" id="meta"></div>
  <div class="top-actions">
    <label class="toggle" title="Show bot hole cards"><input type="checkbox" id="reveal"> Reveal bots</label>
    <label class="toggle" title="Deal next hand automatically"><input type="checkbox" id="autonext"> Auto-deal</label>
    <label class="speed" title="Seconds between bot actions">Delay <input type="range" id="speed" min="0" max="1.5" step="0.1" value="0.7"></label>
    <button class="btn ghost" id="restartBtn" title="Start a fresh match with the same settings">Restart</button>
  </div>
</header>

<main class="layout">
  <section class="table-area">
    <div class="table-wrap">
      <div class="table" id="table">
        <div class="felt">
          <div class="center">
            <div class="pot" id="pot"></div>
            <div class="board" id="board"></div>
            <div class="banner" id="banner"></div>
          </div>
        </div>
        <div id="seats"></div>
        <div id="bets"></div>
      </div>
    </div>
    <div class="action-bar" id="actionBar"></div>
  </section>

  <aside class="side">
    <div id="session"></div>
    <h2>Hand log</h2>
    <ol class="log" id="log"></ol>
    <div class="keys" id="keys"></div>
  </aside>
</main>

<script src="common.js"></script>
<script src="table.js"></script>
</body>
</html>
